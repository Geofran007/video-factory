[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-factory"
version = "0.1.0"
description = "Generador automatizado de videos verticales con HTML, IA y FFmpeg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "playwright>=1.48",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Piper se ejecuta como proceso separado (licencia GPL-3.0); se instala en el mismo venv.
voice = ["piper-tts>=1.3"]
dev = ["pytest>=8.3"]

[project.scripts]
video-factory = "video_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: genera un video completo (lento, requiere FFmpeg y Chromium)",
]
