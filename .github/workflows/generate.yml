name: Generar video

# Ejecución manual (Actions → Generar video → Run workflow). En la Fase 2 se podrá activar la ejecución programada (schedule) y la publicación.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Temática (vacío = usar el ejemplo examples/pulpos.json, sin IA)"
        required: false
        default: ""
      content:
        description: "Archivo de contenido del repo, p. ej. contenidos/mi-video.json (tiene prioridad sobre la temática)"
        required: false
        default: ""
      style:
        description: "Estilo visual (auto = el de la categoría)"
        type: choice
        options: [auto, ciencia, historia, misterio, finanzas, curiosidades, oceano, anime]
        default: auto
      category:
        description: "Categoría"
        type: choice
        options: [curiosidades, ciencia, historia, misterio, finanzas]
        default: curiosidades
      duration:
        description: "Duración objetivo (15-180 s)"
        default: "40"
      voice:
        description: "Voz (chatterbox_latam, mi_voz y voz_zueria tardan 30-90 min sin GPU)"
        type: choice
        options: [masculina, masculina_2, femenina, chatterbox_latam, mi_voz, voz_zueria]
        default: masculina
  # schedule:
  #   - cron: "0 14 * * 1-5"   # Fase 2: un video por día hábil

permissions:
  contents: read

concurrency:
  group: generate-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Configura el secreto en Settings → Secrets and variables → Actions. Nunca en el código.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VF_DAILY_BUDGET_USD: "1.0"
      VF_MAX_JOB_SECONDS: "9000"
      CHATTERBOX: ${{ inputs.voice == 'chatterbox_latam' || inputs.voice == 'mi_voz' || inputs.voice == 'voz_zueria' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e ".[voice]"
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: models/piper
          key: piper-voices-${{ hashFiles('config/providers.json') }}
      - run: python scripts/setup_voices.py

      # Chatterbox (MIT) en su propio entorno: sus dependencias fijas chocan con las del proyecto.
      - name: Caché de Chatterbox (entorno y modelo ~3 GB)
        if: env.CHATTERBOX == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .venv-chatterbox
            models/chatterbox-es-latam
          key: chatterbox-0.1.7-torch2.6.0-${{ runner.os }}-${{ hashFiles('scripts/setup_chatterbox.py') }}
      - name: Instalar Chatterbox
        if: env.CHATTERBOX == 'true'
        run: |
          if [ ! -x .venv-chatterbox/bin/python ]; then
            python -m venv .venv-chatterbox
            .venv-chatterbox/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .venv-chatterbox/bin/python -m pip install chatterbox-tts==0.1.7
          fi
          .venv-chatterbox/bin/python scripts/setup_chatterbox.py
      - name: Descifrar la voz de referencia
        if: inputs.voice == 'mi_voz' || inputs.voice == 'voz_zueria'
        env:
          # Contraseña del cifrado de voces/*.gpg, guardada solo como secreto del repositorio.
          VOICE_PASSPHRASE: ${{ secrets.VOICE_PASSPHRASE }}
          VOICE: ${{ inputs.voice }}
        run: |
          case "$VOICE" in
            mi_voz)     src=voces/referencia.wav.gpg; dst=models/mi-voz/referencia.wav ;;
            voz_zueria) src=voces/voz-zueria.wav.gpg; dst=models/voz-zueria/referencia.wav ;;
          esac
          mkdir -p "$(dirname "$dst")"
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --output "$dst" --decrypt "$src" <<< "$VOICE_PASSPHRASE"

      - run: video-factory doctor

      - name: Generar
        env:
          TOPIC: ${{ inputs.topic }}
          CATEGORY: ${{ inputs.category }}
          DURATION: ${{ inputs.duration }}
          VOICE: ${{ inputs.voice }}
          CONTENT: ${{ inputs.content }}
          STYLE: ${{ inputs.style }}
        run: |
          style_args=()
          if [ -n "$STYLE" ] && [ "$STYLE" != "auto" ]; then style_args=(--style "$STYLE"); fi
          if [ -n "$CONTENT" ]; then
            video-factory generate --content "$CONTENT" --voice "$VOICE" "${style_args[@]}"
          elif [ -n "$TOPIC" ]; then
            video-factory generate --topic "$TOPIC" --category "$CATEGORY" --duration "$DURATION" --voice "$VOICE" "${style_args[@]}"
          else
            video-factory generate --content examples/pulpos.json --voice "$VOICE" "${style_args[@]}"
          fi

      - name: Subir resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/thumbnail.jpg
            output/*/script.md
            output/*/metadata.json
            output/*/subtitles.srt
            output/*/report.json
            output/*/cost.json
            output/*/job.log
          retention-days: 7

      - name: Borrar la voz descifrada
        if: always()
        run: rm -f models/mi-voz/referencia.wav models/voz-zueria/referencia.wav
